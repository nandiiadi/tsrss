name = "tsrss"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Auto-serve static assets (JS, CSS, favicons, app.html)
assets = { directory = "./src/public", binding = "ASSETS" }

# D1 database
[[d1_databases]]
binding = "DB"
database_name = "tsrss-db"
database_id = "aca3d3e5-b842-4246-8f79-d84d6177c5bb"

# KV namespace for password auth sessions
[[kv_namespaces]]
binding = "SESSIONS"
id = "ddf1804eb6f94302a293772619e7a5a9"

# Cron trigger: refresh all feeds every 30 minutes
[triggers]
crons = ["*/30 * * * *"]

# Environment variables
[vars]
TSRSS_AUTH_MODE = "password"
TSRSS_PURGE_DAYS = "30"
TSRSS_VERSION = "vDev"
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# ── Preview environment ──────────────────────────────────────────────────────

[env.preview]
name = "tsrss-preview"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "tsrss-preview-db"
database_id = "aca3d3e5-b842-4246-8f79-d84d6177c5bb"

[[env.preview.kv_namespaces]]
binding = "SESSIONS"
id = "ddf1804eb6f94302a293772619e7a5a9"

# Preview cron disabled — preview is for manual testing only
[env.preview.triggers]
crons = []

[env.preview.vars]
TSRSS_AUTH_MODE = "password"
TSRSS_PURGE_DAYS = "30"
TSRSS_VERSION = "vDev"
